<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>rclicker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="remote" id="remote">
    <header class="top">
      <h1>rclicker</h1>
      <p class="status" id="status" data-state="connecting" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">Connecting…</span>
      </p>
    </header>

    <div class="primary">
      <button type="button" class="btn btn-next" data-command="presentation.next" aria-label="Next slide" aria-keyshortcuts="ArrowRight">
        <span class="btn-label">Next</span>
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4l12 8-12 8z"/></svg>
      </button>
      <button type="button" class="btn btn-prev" data-command="presentation.previous" aria-label="Previous slide" aria-keyshortcuts="ArrowLeft">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 4L5 12l12 8z"/></svg>
        <span class="btn-label">Previous</span>
      </button>
    </div>

    <div class="secondary" role="group" aria-label="Slideshow controls">
      <button type="button" class="btn btn-sec" data-command="presentation.start" aria-label="Start slideshow">Start</button>
      <button type="button" class="btn btn-sec" data-command="presentation.black" aria-label="Black screen on or off">Black</button>
      <button type="button" class="btn btn-sec" data-command="presentation.end" aria-label="End slideshow">End</button>
    </div>

    <p class="message" id="message" aria-live="assertive"></p>
    <p class="awake" id="awake"></p>
  </main>

  <section class="overlay" id="overlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-text">
    <div class="overlay-box">
      <h2 id="overlay-title">Session ended</h2>
      <p id="overlay-text"></p>
      <button type="button" class="btn btn-sec" id="overlay-retry" hidden>Try again</button>
    </div>
  </section>

  <noscript><p class="noscript">rclicker needs JavaScript turned on.</p></noscript>
</body>
</html>
