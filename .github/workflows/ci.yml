name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PresentationRemote.sln

      - name: Build (Release)
        run: dotnet build PresentationRemote.sln -c Release --no-restore

      - name: Test
        run: dotnet test PresentationRemote.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish win-x64
        run: dotnet publish src/PresentationRemote/PresentationRemote.csproj -c Release -r win-x64 -o artifacts/publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: PresentationRemote-win-x64
          path: artifacts/publish/win-x64/PresentationRemote.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
