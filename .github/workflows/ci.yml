name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the portable EXE release after all checks pass
        required: true
        default: false
        type: boolean

# Third-party actions are pinned to exact commits (tag in the comment); Dependabot proposes updates.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      relay: ${{ steps.relay.outputs.set }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test shared signature verification
        shell: pwsh
        run: ./tools/test-signature-verification.ps1

      - name: Test MSIX signing workflow guards
        shell: pwsh
        run: ./tools/test-msix-signing-workflow.ps1

      - name: Test release publisher guards
        shell: bash
        run: ./tools/test-publish-release.sh

      - name: Restore
        run: dotnet restore RClicker.sln

      - name: Build (Release)
        run: dotnet build RClicker.sln -c Release --no-restore

      - name: Test
        run: dotnet test RClicker.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      # The relay address is a repository secret (Settings → Secrets and variables → Actions →
      # RELAY_URL), so it is built into the app without appearing in the code or the logs.
      - name: Relay address
        id: relay
        shell: bash
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          if [ -n "$RELAY_URL" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The RELAY_URL secret is not set: this build has no relay address and will not be released."
          fi

      - name: Publish win-x64
        env:
          RelayUrl: ${{ secrets.RELAY_URL }}
        run: dotnet publish src/RClicker/RClicker.csproj -c Release -r win-x64 -o artifacts/publish/win-x64

      - name: Validate Windows package
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/publish/win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'rclicker.exe') {
            throw "The release package must contain exactly one runnable rclicker.exe (found: $($files.Name -join ', '))."
          }
          if ($files[0].Length -lt 100MB) {
            throw "The release executable is unexpectedly small ($($files[0].Length) bytes); compression may have been enabled again."
          }
          Write-Host "Validated uncompressed single-file package: $($files[0].Length) bytes"

      - name: Build unsigned MSIX package
        shell: pwsh
        env:
          RelayUrl: ${{ secrets.RELAY_URL }}
        run: ./tools/build-msix.ps1 -RuntimeIdentifier win-x64 -OutputDirectory artifacts/msix/win-x64

      - name: Test MSIX lifecycle on an isolated package identity
        shell: pwsh
        env:
          RelayUrl: ${{ secrets.RELAY_URL }}
        run: ./tools/test-msix.ps1 -PackagePath artifacts/msix/win-x64/rclicker-x64.msix

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rclicker-win-x64
          path: artifacts/publish/win-x64/rclicker.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rclicker-msix-win-x64-unsigned
          path: artifacts/msix/win-x64/rclicker-x64.msix
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Workers runtime)
        run: npm test

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

  # Code signing with Azure Artifact Signing through the shared workflow (also used by other
  # repositories). Only main is signed. Until the Azure IDs are filled in, it signs nothing
  # and the release stays unsigned.
  sign:
    needs: [build, relay]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build.outputs.relay == 'true'
    permissions:
      contents: read
      id-token: write # Azure sign-in without stored secrets (OIDC)
    uses: ./.github/workflows/sign-windows.yml
    with:
      artifact: rclicker-win-x64
      file-types: exe

  # Signs the MSIX artifact with the same Azure OIDC workflow. Main releases
  # consume this verified artifact; preview releases retain their portable-only flow.
  sign-msix:
    needs: [build, relay]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build.outputs.relay == 'true'
    permissions:
      contents: read
      id-token: write # Azure sign-in without stored secrets (OIDC)
    uses: ./.github/workflows/sign-windows.yml
    with:
      artifact: rclicker-msix-win-x64-unsigned
      file-types: msix

  # Publishes the signed portable and MSIX artifacts as a GitHub Release (direct download, no sign-in).
  # main → release only when a manual run sets publish_release=true; claude/* branches
  # retain their automatic vX.Y.Z-preview publication. Preview re-runs replace their files;
  # stable main releases are immutable and reject mismatched existing tags/releases.
  release:
    needs: [build, relay, sign, sign-msix]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/'))) &&
      needs.build.result == 'success' && needs.relay.result == 'success' &&
      needs.build.outputs.relay == 'true' &&
      ((github.ref == 'refs/heads/main' && needs.sign.result == 'success' && needs.sign.outputs.signed == 'true' && needs['sign-msix'].result == 'success' && needs['sign-msix'].outputs.signed == 'true') ||
      (startsWith(github.ref, 'refs/heads/claude/') && (needs.sign.result == 'success' || needs.sign.result == 'skipped')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign.outputs.signed == 'true' && 'rclicker-win-x64-signed' || 'rclicker-win-x64' }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.ref == 'refs/heads/main' && needs['sign-msix'].outputs.signed == 'true'
        with:
          name: rclicker-msix-win-x64-unsigned-signed
          path: dist

      - name: Read release version
        id: version
        shell: bash
        run: echo "value=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.sign.outputs.signed == 'true' }}
          MSIX_SIGNED: ${{ needs['sign-msix'].outputs.signed == 'true' }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/publish-release.sh
