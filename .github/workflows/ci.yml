name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RClicker.sln

      - name: Build (Release)
        run: dotnet build RClicker.sln -c Release --no-restore

      - name: Test
        run: dotnet test RClicker.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish win-x64
        run: dotnet publish src/RClicker/RClicker.csproj -c Release -r win-x64 -o artifacts/publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: rclicker-win-x64
          path: artifacts/publish/win-x64/rclicker.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Workers runtime)
        run: npm test

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

